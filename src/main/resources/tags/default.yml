# Frame transition rate (in ticks), -1 to disable
frame-update-rate: -1
# Placeholder update rate (in ticks), -1 to disable
placeholders-update-rate: 10

frames:
  # First frame
  - text: |-
      {owner:prefix}&r{owner:name}{owner:suffix}
      &c❤&f{owner:health}

    # NOTE: All parameters below show their default values.
    # You can specify only "text" and the rest will use these defaults.

    # Position offsets (float)
    x-offset: 0.0
    y-offset: 0.15
    z-offset: 0.0

    # Opacity on player sneaks | from -128 to 127
    opacity: 60

    # Scale (float, default 1.0)
    scale: 1.0

    # Billboard behavior (boolean)
    vertical-billboard: false

    # Brightness in "type-strength" format
    # Type: "block" or "sky"
    # Strength: 0-15
    brightness: "block-15"

    # View range in blocks (float)
    view-range: 1.0

    # Shadow parameters (float)
    shadow-radius: 0.0
    shadow-strength: 1.0

    # Line width (integer)
    line-width: 200

    # Background color (hex or integer)
    # Format: #RRGGBB (6 digits) or #AARRGGBB (8 digits with alpha)
    background-color: "#00000000"  # Transparent

    # Text opacity (-128-127)
    text-opacity: -1

    # Text opacity on player sneaks (-128-127)
    sneak-text-opacity: 60

    # Shadow rendering (boolean)
    shadowed: true

    # See-through mode (boolean)
    see-through: false

    # Use default background (boolean)
    default-background: false

    # Text alignment: LEFT, CENTER, or RIGHT
    alignment: "CENTER"
