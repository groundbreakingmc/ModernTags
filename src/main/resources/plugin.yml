name: "ModernTags"
main: "com.github.groundbreakingmc.moderntags.ModernTags"
version: "2.2.0"
api-version: "1.20"
folia-supported: true

author: "GroundbreakingMC"
website: "https://github.com/groundbreakingmc"

depend: [ "packetevents" ]
softdepend: [ "PlaceholderAPI", "Vault" ]
libraries: [ "org.spongepowered:configurate-yaml:4.2.0" ]

commands:
  moderntags:
    description: "Reload ModernTags or download an update"

permissions:
  moderntags.admin:
    description: "Allows to reload plugin or download its updates"
    default: op

  moderntags.see.own:
    description: "Allows to see own tag"
    default: false
