# Parse Vault prefix/suffix placeholders using MiniMessage format.
# If false, treated as legacy (&-formatted) strings.
# ──
# Парсить плейсхолдеры Vault через MiniMessage.
# false — обрабатывать как legacy (&-форматирование).
vault-mm-formatting: false

# Hide the tag when another entity sits on the player.
# ──
# Скрыть тег, когда на игрока садится другая сущность.
hide-tag-when-has-passenger: true

# Plugin tick rate in milliseconds.
# ──
# Интервал тика плагина в миллисекундах.
tick-rate: 50

# Settings for the legacy below-name objective (shown to all clients).
# ──
# Настройки строки под ником для legacy-клиентов.
legacy-general:
  below-name-value: "owner:health" # do not use {} here / без фигурных скобок
  below-name-text: "&c❤"

# Tag groups
# Groups are sorted by priority — highest wins.
# owner-conditions  — checked once per tag owner
# viewer-conditions — checked per viewer
#
# Client version (TextDisplay vs Scoreboard Teams) is picked automatically
# from the "modern" / "legacy" sections in each tag file.
# ──
# Группы тегов
# Сортируются по приоритету — побеждает наибольший.
# owner-conditions  — проверяется один раз для владельца тега
# viewer-conditions — проверяется для каждого наблюдателя
#
# Версия клиента (TextDisplay / Scoreboard Teams) определяется автоматически
# по секциям "modern" / "legacy" в файлах тегов.
tags:
  # Default group / Группа по умолчанию
  - priority: 0
    entries:
      - priority: 0
        modern: tags/default.yml:<root>
        legacy: tags/default-legacy.yml:<root>

  # VIP group / VIP-группа
  - priority: 1
    owner-conditions: "hasPermission('moderntags.tag.vip')"
    entries:
      - priority: 0
        modern: tags/vip.yml:modern
        legacy: tags/vip.yml:legacy
