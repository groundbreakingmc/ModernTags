# Frame transition rate in ticks. -1 disables animation.
# ──
# Интервал смены кадров в тиках. -1 — анимация отключена.
frame-update-rate: -1

# Placeholder update rate in ticks. -1 disables updates.
# ──
# Интервал обновления плейсхолдеров в тиках. -1 — обновление отключено.
placeholders-update-rate: 10

# Keep the player name color set by other plugins (e.g. glow plugins).
# ──
# Сохранять цвет ника, установленный другими плагинами (например, glow).
preserve-player-name-color: true

# Colors treated as "no color set" — the frame's name-color is used instead.
# ──
# Цвета, считающиеся «не заданными» — вместо них применяется name-color кадра.
ignored-colors: [ "white" ]

frames:
  - prefix: "{owner:prefix}"
    name-color: "white"
    suffix: "{owner:suffix}"
